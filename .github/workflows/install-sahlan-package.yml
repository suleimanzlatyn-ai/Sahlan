name: Install latest SAHLAN website package
on:
  push:
    branches: [main]
    paths:
      - ".sahlan-upload/READY"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore upgraded website
        run: |
          cat .sahlan-upload/part*.b64 > /tmp/site.b64
          base64 -d /tmp/site.b64 | tar -xz -C .
          rm -rf .sahlan-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install latest SAHLAN Premium Cleaners multi-page website"
          git push